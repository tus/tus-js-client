name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Match the exact tooling release validated by CI.
          node-version: '26.12.1'
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
